<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThreadGen Indo</title>
    <script>
      // Protect window.fetch from being overwritten by Node.js polyfills
      (function() {
        const originalFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            get: () => originalFetch,
            set: (val) => {
              console.warn('Attempt to overwrite window.fetch blocked:', val);
            },
            configurable: false
          });
        } catch (e) {
          console.error('Failed to protect window.fetch:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
